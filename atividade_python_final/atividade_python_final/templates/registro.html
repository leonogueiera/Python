{% extends 'base.html' %}{% block title %}Cadastro • {{ app_name }}{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-7 col-lg-6"><div class="card shadow-sm border-0"><div class="card-body p-4 p-md-5"><h1 class="h3 mb-4">Criar conta</h1><form method="post"><div class="mb-3"><label class="form-label">Nome</label><input class="form-control" name="nome" required></div><div class="mb-3"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" required></div><div class="mb-3"><label class="form-label">Senha</label><input class="form-control" type="password" name="senha" minlength="6" required></div><div class="mb-3"><label class="form-label">Confirmar senha</label><input class="form-control" type="password" name="confirmar_senha" minlength="6" required></div><button class="btn btn-primary w-100" type="submit">Cadastrar</button></form><div class="text-center mt-3"><a href="{{ url_for('auth.login') }}">Voltar para login</a></div></div></div></div></div>{% endblock %}
