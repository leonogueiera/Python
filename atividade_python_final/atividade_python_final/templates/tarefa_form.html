{% extends 'base.html' %}{% block title %}{{ 'Editar' if tarefa else 'Nova' }} tarefa • {{ app_name }}{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">{{ 'Editar tarefa' if tarefa else 'Nova tarefa' }}</h1><a class="btn btn-outline-secondary" href="{{ url_for('tasks.dashboard') }}">Voltar</a></div><div class="card shadow-sm border-0"><div class="card-body p-4"><form method="post"><div class="mb-3"><label class="form-label">Título</label><input class="form-control" name="titulo" value="{{ tarefa['titulo'] if tarefa else '' }}" required></div><div class="mb-3"><label class="form-label">Descrição</label><textarea class="form-control" name="descricao" rows="5">{{ tarefa['descricao'] if tarefa else '' }}</textarea></div><div class="mb-4"><label class="form-label">Status</label><select class="form-select" name="status"><option value="pendente" {{ 'selected' if not tarefa or tarefa['status']=='pendente' else '' }}>Pendente</option><option value="em_andamento" {{ 'selected' if tarefa and tarefa['status']=='em_andamento' else '' }}>Em andamento</option><option value="concluida" {{ 'selected' if tarefa and tarefa['status']=='concluida' else '' }}>Concluída</option></select></div><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Salvar</button></form></div></div></div></div>{% endblock %}
