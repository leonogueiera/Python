{% extends 'base.html' %}{% block title %}Progresso • {{ app_name }}{% endblock %}
{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2">Dashboard de Progresso</h1><p class="text-secondary mb-0">Visão visual das tarefas por status.</p></div><a href="{{ url_for('tasks.dashboard') }}" class="btn btn-outline-secondary">Voltar</a></div><div class="card shadow-sm border-0"><div class="card-body"><div style="height:360px"><canvas id="progressChart"></canvas></div></div></div><div class="card shadow-sm border-0 mt-4"><div class="card-body"><h2 class="h5">Tarefas em tempo real</h2><div id="taskList" class="row g-2"></div></div></div>{% endblock %}
{% block scripts %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script src="{{ url_for('static', filename='js/progresso.js') }}"></script>{% endblock %}
