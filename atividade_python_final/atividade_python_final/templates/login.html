{% extends 'base.html' %}{% block title %}Login • {{ app_name }}{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow-sm border-0"><div class="card-body p-4 p-md-5"><div class="text-center mb-4"><i class="bi bi-person-circle display-5 text-primary"></i><h1 class="h3 mt-2">Entrar</h1><p class="text-secondary">Acesse seu painel de tarefas.</p></div><form method="post" novalidate><div class="mb-3"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" required autocomplete="email"></div><div class="mb-3"><label class="form-label">Senha</label><input class="form-control" type="password" name="senha" required autocomplete="current-password"></div><button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i> Entrar</button></form><div class="text-center mt-4">Ainda não possui conta? <a href="{{ url_for('auth.registro') }}">Criar cadastro</a></div></div></div></div></div>{% endblock %}
